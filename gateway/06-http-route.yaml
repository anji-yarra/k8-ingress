apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app1
  namespace: roboshop
spec:
  hostnames:
  - app1.anjidevops.online
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: roboshop
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: app1
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /